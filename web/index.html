<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preload" href="/fonts/space-grotesk-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="ard" href="/ard.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b07" />
    <meta
      name="description"
      content="Greentrip Technologies — Ultra-modern AI consulting, agentic systems, LLM platforms, and applied machine learning for enterprises."
    />

    <meta
      property="og:description"
      content="We design, build, and operate AI systems: agents, LLM apps, RAG, MLOps, and computer vision."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://greentripai.com" />
    <title>Greentrip Technologies — Applied AI for Modern Enterprises</title>
